{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="card">
    <div class="card-header"><div class="card-title">🔑 Change Your Password</div></div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('change_password') }}">
        <div class="form-group">
          <label>Current Password *</label>
          <input type="password" name="current_password" required placeholder="Your current password">
        </div>
        <div class="form-group">
          <label>New Password *</label>
          <input type="password" name="new_password" required placeholder="At least 6 characters" minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm New Password *</label>
          <input type="password" name="confirm_password" required placeholder="Repeat new password">
        </div>
        <div class="d-flex gap-2" style="margin-top:8px;">
          <button type="submit" class="btn btn-gold">Update Password</button>
          <a href="{{ url_for('member_portal') }}" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
